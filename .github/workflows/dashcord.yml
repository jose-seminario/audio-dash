name: Build DashCord (Windows x64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dashcord/**'
      - '.github/workflows/dashcord.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'Dashcord/**'
      - '.github/workflows/dashcord.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-dashcord:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Dashcord

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Dashcord/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Verify Frontend Compilation
        run: npm run build

      - name: Run Backend Unit Tests (SuperProperties & Keychain Mock)
        working-directory: Dashcord/src-tauri
        run: cargo test --workspace --all-features --verbose

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Dashcord
          tagName: dashcord-v__VERSION__
          releaseName: 'DashCord v__VERSION__'
          releaseBody: 'Automated release for DashCord generated by GitHub Actions'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dashcord
          path: |
            Dashcord/src-tauri/target/release/bundle/nsis/*.exe
            Dashcord/src-tauri/target/release/bundle/msi/*.msi
            Dashcord/src-tauri/target/release/*.exe
          if-no-files-found: error
