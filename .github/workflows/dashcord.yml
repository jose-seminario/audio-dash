name: Build DashCord (Windows x64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dashcord/**'
      - '.github/workflows/dashcord.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'Dashcord/**'
      - '.github/workflows/dashcord.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-dashcord:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Dashcord/package-lock.json'

      - name: Setup NASM for BoringSSL
        uses: ilammy/setup-nasm@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: Dashcord
        run: npm ci || npm install

      - name: Verify TypeScript & Frontend Build
        working-directory: Dashcord
        run: |
          npx tsc --noEmit
          npm run build

      - name: Audit - Dependency Trees for reqwest and openssl-sys
        working-directory: Dashcord/src-tauri
        shell: bash
        run: |
          echo "=== AUDIT: reqwest in tree ==="
          cargo tree -i reqwest 2>&1 || echo "reqwest not found (clean)"
          echo "=== AUDIT: openssl-sys in tree ==="
          cargo tree -i openssl-sys 2>&1 || echo "openssl-sys not found (clean)"
          echo "=== AUDIT: boring-sys / btls in tree ==="
          cargo tree -i btls-sys 2>&1 || cargo tree -i boring-sys 2>&1 || echo "btls-sys checked"

      - name: Guard - Zero reqwest & Zero openssl-sys
        working-directory: Dashcord/src-tauri
        shell: bash
        run: |
          if cargo tree -i reqwest 2>/dev/null | grep -q reqwest; then
            echo "::error::reqwest detected! Evasion layer compromised."
            exit 1
          fi
          if cargo tree -i openssl-sys 2>/dev/null | grep -q openssl-sys; then
            echo "::error::openssl-sys detected, may conflict with boring-sys"
            exit 1
          fi
          echo "Guard PASS: reqwest and openssl-sys are 0% present in dependency graph."

      - name: Run Backend Unit Tests (SuperProperties, Keychain Mock, & Async Send Regression)
        working-directory: Dashcord/src-tauri
        shell: bash
        run: cargo test --workspace --all-features --verbose

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Dashcord
          tagName: dashcord-v__VERSION__
          releaseName: 'DashCord v__VERSION__'
          releaseBody: 'Automated release for DashCord generated by GitHub Actions'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dashcord
          path: |
            Dashcord/src-tauri/target/release/bundle/nsis/*.exe
            Dashcord/src-tauri/target/release/bundle/msi/*.msi
            Dashcord/src-tauri/target/release/*.exe
          if-no-files-found: error
