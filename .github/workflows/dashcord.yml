name: Build DashCord (Windows x64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dashcord/**'
      - '.github/workflows/dashcord.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'Dashcord/**'
      - '.github/workflows/dashcord.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-dashcord:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Dashcord/package-lock.json'

      - name: Setup NASM for BoringSSL
        uses: ilammy/setup-nasm@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: Dashcord
        run: npm ci || npm install

      - name: Verify Frontend Compilation
        working-directory: Dashcord
        run: npm run build

      - name: Run Backend Unit Tests (SuperProperties & Keychain Mock)
        working-directory: Dashcord/src-tauri
        shell: cmd
        run: cargo test --workspace --all-features --verbose > ..\test_result.txt 2>&1

      - name: Upload Test Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-result
          path: Dashcord/test_result.txt

      - name: Display Test Results & Verify Success
        working-directory: Dashcord
        shell: powershell
        run: |
          $content = Get-Content test_result.txt -Raw
          Write-Output $content
          if ($content -match "FAILED" -or $content -match "error:") {
            Write-Error "Cargo test reported failure"
            exit 1
          }

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Dashcord
          tagName: dashcord-v__VERSION__
          releaseName: 'DashCord v__VERSION__'
          releaseBody: 'Automated release for DashCord generated by GitHub Actions'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dashcord
          path: |
            Dashcord/src-tauri/target/release/bundle/nsis/*.exe
            Dashcord/src-tauri/target/release/bundle/msi/*.msi
            Dashcord/src-tauri/target/release/*.exe
          if-no-files-found: error
